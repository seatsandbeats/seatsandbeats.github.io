<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 32px 20px 64px; }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.9em; line-height: 1.2; margin: 0 0 0.6em; }
  h2 { font-size: 1.25em; margin: 1.8em 0 0.4em; }
  a { color: #a0641e; }
  li { margin: 0.3em 0; }
  header { max-width: 680px; margin: 0 auto 28px; text-align: center; }
  header img { border-radius: 18px; display: block; margin: 0 auto 14px; }
  nav { font-size: 0.95em; }
  nav a { margin: 0 9px; text-decoration: none; }
  @media (prefers-color-scheme: dark) { a { color: #f5b21d; } }
</style>
</head>
<body>
<header>
  <a href="{{ '/' | relative_url }}" aria-label="Seats &amp; Beats home">
    <picture>
      <source srcset="{{ '/assets/wordmark-dark.png' | relative_url }}" media="(prefers-color-scheme: dark)">
      <img src="{{ '/assets/wordmark-light.png' | relative_url }}" alt="Seats &amp; Beats" width="150" height="196">
    </picture>
  </a>
  <nav><a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/guide' | relative_url }}">Guide</a><a href="{{ '/privacy' | relative_url }}">Privacy</a><a href="{{ '/support' | relative_url }}">Support</a></nav>
</header>
<main>
{{ content }}
</main>
</body>
</html>
